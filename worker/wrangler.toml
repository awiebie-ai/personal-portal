name = "portfolio-headlines"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# Fires at 11:00, 12:00, 23:00, and 00:00 UTC — the EDT/EST equivalents of
# both 7:00 AM and 7:00 PM America/New_York — since cron triggers can't be
# timezone-aware. The scheduled handler in src/worker.js checks the current
# Eastern hour and only refreshes on whichever one actually lands at 7 AM
# or 7 PM that day.
[triggers]
crons = ["0 11 * * *", "0 12 * * *", "0 23 * * *", "0 0 * * *"]

# Created via: wrangler kv namespace create HEADLINES_KV
[[kv_namespaces]]
binding = "HEADLINES_KV"
id = "8068760f7a654443a15a12c51dee91dd"

# refreshAll() does real CPU-bound work per invocation — PDF text extraction
# (unpdf/pdf.js) for SCOTUS opinions (up to 77 pages) and Congressional
# Daily Digests, on top of parsing ~20 XML/HTML feeds. The Free plan's fixed
# 10ms cron CPU budget silently killed the isolate mid-refresh before this
# could finish, leaving whichever cards hadn't written yet on stale data.
# Paid plan's default is 30s; set explicitly here with headroom to spare.
[limits]
cpu_ms = 120000
